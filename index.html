<style>
/*
VOICE: blocky voxel sandbox, friendly and plain
IDEA: a pixel-block volleyball court; the net is PLP on the enzyme, the ball is NH2
PICTURE: blue sky, square clouds, grass-and-dirt ground, molecules drawn as skeletal structures
COLOUR and TYPE: sky blue, grass green, dirt brown, stone grey, gold PLP, red NH2; Noto Sans TC throughout
LAYOUT: title, HUD, game, touch pad, live diagrams
*/
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ea,#151515);--ink:light-dark(#1e1e1e,#ececec);--mute:light-dark(#5b5b5b,#a9a9a9);
--stone:#3d3d3d;--edge:#1b1b1b;--gold:#f5c518;--nh:#1e88e5;--ok:#7bd16a;--bad:#ff8a80}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",sans-serif;overflow-x:clip}
.hd,h1{font-family:"Noto Sans TC",sans-serif;font-weight:700}
main{max-width:1200px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:10px max(2vw,10px)}
.lab{display:flex;align-items:center;gap:8px;margin:0 0 4px;font:700 15px/1.2 "Noto Sans TC",sans-serif;color:var(--ink)}.lab img{height:34px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 6px;box-sizing:content-box;border:1px solid #d6d2c4}
h1{margin:0 0 4px;font-size:clamp(22px,3.6vw,36px);line-height:1.1;color:#ffd54f;text-shadow:-2px -2px 0 #1b1b1b,2px -2px 0 #1b1b1b,-2px 2px 0 #1b1b1b,2px 2px 0 #1b1b1b,0 -2px 0 #1b1b1b,0 2px 0 #1b1b1b,-2px 0 0 #1b1b1b,2px 0 0 #1b1b1b,3px 4px 0 rgba(0,0,0,.35)}
.sub{margin:0 0 8px;color:var(--mute);max-width:90ch;font-size:15px}
.cab{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:var(--stone);color:#ececec;padding:10px;border:4px solid var(--edge);box-shadow:inset 3px 3px 0 #626262,inset -3px -3px 0 #262626}
.hud .snd{min-height:44px;border:3px solid var(--edge);background:#5a5a5a;color:#fff;font:700 15px "Noto Sans TC",sans-serif;padding:0 14px;cursor:pointer}
.hud{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.hud div{background:#262626;border:3px solid var(--edge);padding:4px 12px;text-align:center}
.hud small{display:block;font-size:13px;color:#a9a9a9}.hud b{font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:22px;white-space:nowrap}
.fig{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
.fig canvas{display:block;border:3px solid var(--edge);image-rendering:pixelated}
.msg{margin-top:10px;background:#262626;border:3px solid var(--edge);padding:8px 14px;min-height:46px}
.msg.ok{box-shadow:inset 5px 0 var(--ok)}.msg.bad{box-shadow:inset 5px 0 var(--bad)}.msg b{color:var(--gold)}
.tc{display:none;position:absolute;inset:0;z-index:3;touch-action:none;user-select:none;-webkit-user-select:none}
.stick{position:absolute;left:2%;bottom:3%;width:min(34%,260px);height:52px;border-radius:26px;background:rgba(0,0,0,.22);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-between;padding:0 12px;touch-action:none}
.stick .ar{color:rgba(255,255,255,.85);font:700 15px "Noto Sans TC",sans-serif;pointer-events:none}
.stick.on{background:rgba(0,0,0,.32)}
.knob{position:absolute;left:50%;top:50%;width:40px;height:40px;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.8);transform:translate(-50%,-50%)}
.tbtn{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.75);color:#fff;font:700 15px "Noto Sans TC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;text-shadow:0 1px 2px #000}
#tJump{right:3%;bottom:7%;width:104px;height:104px;background:rgba(95,168,59,.28)}
#tHit{right:calc(3% + 10px);bottom:calc(7% + 114px);width:84px;height:84px;background:rgba(245,197,24,.28)}
.tbtn.on{transform:scale(.92);filter:brightness(1.2)}
.tlogo{display:none;position:absolute;left:8px;top:8px;height:34px;width:auto;background:#fff;border-radius:8px;padding:3px 5px;pointer-events:none}
.olab{display:none;align-items:center;gap:8px;margin:0 0 6px;font:700 13px/1.2 "Noto Sans TC",sans-serif;color:#fff}.olab img{height:26px;background:#fff;border-radius:6px;padding:2px 4px}
.otitle{display:none;font:700 22px/1.2 "Noto Sans TC",sans-serif;color:#ffd54f;margin:0 0 6px}
@media (pointer:coarse){.olab{display:flex}.otitle{display:block}}
.tsnd{position:absolute;right:8px;top:8px;border:2px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);color:#fff;font:700 12px "Noto Sans TC",sans-serif;padding:4px 10px}
.rot{display:none;position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font:12px "Noto Sans TC",sans-serif;padding:4px 10px;white-space:nowrap;pointer-events:none}
@media (pointer:coarse){.tc{display:block}.pad{display:none!important}}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}.tsnd{display:none}#tJump{width:66px;height:66px}#tHit{width:56px;height:56px;right:calc(3% + 5px);bottom:calc(7% + 74px)}}
@media (pointer:coarse) and (orientation:landscape){
 .lab,h1,.sub,.hud{display:none!important}
 main{padding:0;max-width:none}
 .cab{padding:0;border:0;box-shadow:none}
 .msg{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:min(70%,620px);z-index:4;font-size:12px;padding:4px 10px;min-height:0;background:rgba(27,27,27,.72);border-width:2px}
 .msg:not(:has(button)){pointer-events:none}
 .msg{opacity:0;transition:opacity .4s}.msg.fresh,.msg:has(button){opacity:1}
 .fig canvas{border:0}
 .tlogo{display:block}
}
.rotlock{display:none;position:fixed;inset:0;z-index:50;background:#1b1b1b;color:#fff;place-items:center;text-align:center;font-family:"Noto Sans TC",sans-serif}
.rotlock b{display:block;font-size:22px;margin:18px 0 6px}.rotlock span{color:#bbb;font-size:15px}
.rotlock .ph{width:54px;height:92px;margin:0 auto;border:4px solid #fff;border-radius:10px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){.rotlock .ph{animation:none;transform:rotate(-90deg)}}
@media (pointer:coarse) and (orientation:portrait){.rotlock{display:grid}}
.pad{display:none;margin-top:10px;grid-template-columns:72px 72px 1fr 1fr;gap:8px}
.pad button{min-height:60px;border:3px solid var(--edge);background:#5a5a5a;color:#fff;font:inherit;font-size:24px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:inset 3px 3px 0 #7a7a7a,inset -3px -3px 0 #3a3a3a}
.pad .j{background:#5fa83b;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:20px;box-shadow:inset 3px 3px 0 #7fc85b,inset -3px -3px 0 #3f7f22}
@media (pointer:coarse){.pad{display:grid}}
.ov{position:absolute;inset:0;z-index:5;display:grid;place-items:start center;background:#1b1b1bf0;padding:18px;overflow:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:10px}
.pk{display:grid;gap:6px;justify-items:center;padding:10px;border:3px solid var(--edge);background:#2e2e2e;color:#ececec;font:inherit;cursor:pointer;box-shadow:inset 3px 3px 0 #444,inset -3px -3px 0 #1f1f1f}
.pk:hover,.pk:focus-visible{border-color:var(--gold);outline:none}
.pk canvas{width:100%;max-width:300px;height:auto;max-height:28vh;object-fit:contain;border:3px solid var(--edge)}
.pk b{font:700 17px "Noto Sans TC",sans-serif}.pk span{font-size:14px;color:#a9a9a9}
.ov.center{place-items:center;text-align:center}.ov[hidden]{display:none}.ov .in{max-width:640px;width:100%}
.ov h2{font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:clamp(18px,2.6vw,24px);line-height:1.2;margin:0 0 6px}
.ov p{margin:0 0 8px;color:#dedede}
.rule{display:grid;gap:6px;margin:10px 0 14px}.rule div{background:#2e2e2e;padding:7px 12px}.rule b{color:var(--gold)}.n{color:var(--nh);font-weight:700}
.note{font-size:14px;color:#a9a9a9}.btns{display:flex;flex-wrap:wrap;gap:10px}
button.go{min-height:40px;padding:6px 16px;border:3px solid var(--edge);background:#5fa83b;color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
button.go.alt{background:#5a5a5a}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.qopt{display:grid;gap:8px;margin:8px 0 12px}
.qopt button{min-height:44px;text-align:left;padding:8px 14px;border:3px solid #555;background:transparent;color:#ececec;font:inherit;cursor:pointer}
.qopt button.r{border-color:var(--ok);color:var(--ok);font-weight:700}.qopt button.w{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.f65{margin-top:10px;background:#262626;border:3px solid var(--edge);padding:10px 12px}
.f65 h3{margin:0 0 6px;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:18px;color:var(--gold)}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:8px}
.pane{margin:0;background:#303030;padding:6px 8px;border:3px solid #1f1f1f}.pane.on{border-color:var(--gold)}
.pane figcaption{font-size:13px;color:#a9a9a9;padding:0 4px 4px}
.f65 svg,.ov .fsv svg{width:100%;height:auto;display:block;max-height:260px}
.f65 p{margin:4px 0 0;font-size:15px;color:#dedede}.f65 p b{color:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opts button{min-height:44px;padding:6px 14px;border:3px solid #555;background:#2e2e2e;color:#ececec;font:inherit;cursor:pointer}
.fsv [data-b]{cursor:pointer}
@media(max-width:600px){
 .hud{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
 .hud div{padding:3px 6px}.hud small{font-size:11px;line-height:1.3}.hud b{font-size:15px;white-space:normal;line-height:1.25;display:block}
 .hud .full{display:none}
 .hud .snd{min-height:32px;align-self:center;padding:0 8px;font-size:12px;border-width:2px}
 .msg{font-size:14px;padding:6px 10px;min-height:40px}
 .lab{font-size:13px}.lab img{height:26px}
 .sub{font-size:13px;margin-bottom:6px}
 .cab{padding:6px}
}
</style>
</head>

   if(d0){S.donor=d0;S.owner=null;figSet(d0.k,S.L.e,null,1);say(`NH₂ leaves <b>${AA[d0.k]}</b> (now ${KA[d0.k]}) — over the net: <b>PLP → PMP</b>.`,'ok')}}
  for(const p of [me,S.cpu]){if(p.cd>0)continue;const h=HEAD(p);if(Math.hypot(b.x-h.x,b.y-h.y)<(p===me?RME:R)+BR_)touch(p,b)}
  if(b.y>=GROUND-BR_){b.y=GROUND-BR_;point(b.x<NETX?1:0,`The NH₂ hit the ground on ${b.x<NETX?'your':AA[S.L.opp]+'’s'} side.`)}
 }else if(S.pause>0&&S.serving&&!S.dead){const h=HEAD(S.serving);b.x=h.x+(S.serving.side<0?10:-10);b.y=h.y-150}
 S.flash=Math.max(0,S.flash-dt);
 for(const f of S.fx){f.y-=35*dt;f.a-=dt}S.fx=S.fx.filter(f=>f.a>0);
 draw();(rafId=requestAnimationFrame(loop));
}
function figReset(e){const w=$('pw'+e);if(w)w.innerHTML=panelSvg(e);FS[e]=null}

/* ---------- drawing ---------- */
let BGC=null;
function bgLayer(){
 const d=sc*DPR,c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const real=ctx;const g=c.getContext('2d');g.setTransform(d,0,0,d,OX*d,0);
 ctx=g;try{ const gr=ctx.createLinearGradient(0,0,0,VH);gr.addColorStop(0,'#6fb2ff');gr.addColorStop(1,'#cbe8ff');ctx.fillStyle=gr;ctx.fillRect(-OX-2,0,VW+2*OX+4,VH);  ctx.fillStyle='#fff';for(const [cx,cy,cw] of [[70,60,7],[330,40,5],[620,70,8],[840,30,5],[-170,50,6],[1010,80,6]]){for(let k=0;k<cw;k++){ctx.fillRect(cx+k*16,cy,16,16);if(k>0&&k<cw-1)ctx.fillRect(cx+k*16,cy-16,16,16);if(k>1&&k<cw-2)ctx.fillRect(cx+k*16,cy+16,16,16)}}  for(let c=Math.floor(-OX/TL)-1;c<Math.ceil((VW+OX)/TL)+1;c++){const X=c*TL;pix(X,GROUND,'#8b5a2b',['#6b4220','#a06a38'],3);pix(X,GROUND+TL,'#8b5a2b',['#6b4220','#a06a38'],5);ctx.fillStyle='#5fa83b';ctx.fillRect(X,GROUND,TL,10);for(let i=0;i<8;i++){if(hsh(c,i)<.5){ctx.fillStyle='#4c8f2e';ctx.fillRect(X+i*5,GROUND+10,5,5)}if(hsh(i,c)<.3){ctx.fillStyle='#7cc451';ctx.fillRect(X+i*5,GROUND,5,5)}}} if(OX>0){ctx.fillStyle='rgba(0,0,0,.10)';ctx.fillRect(-OX-2,0,OX+2,VH);ctx.fillRect(VW,0,OX+2,VH)} }finally{ctx=real}
 return c;
}
function draw(){
 if(!BGC||BGC.width!==cv.width)BGC=bgLayer();
 ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(BGC,0,0);ctx.restore();
 if(!S)return;
 const L=S.L,b=S.ball,pmp=S.flash>0;
 // enzyme sign standing behind the net
 ctx.fillStyle='#5b3a1a';ctx.fillRect(NETX-38,NETTOP-60,6,GROUND-NETTOP+60);ctx.fillRect(NETX+32,NETTOP-60,6,GROUND-NETTOP+60);
 ctx.fillStyle='#3b2410';ctx.fillRect(NETX-58,NETTOP-104,116,64);ctx.fillStyle='#a0743c';ctx.fillRect(NETX-55,NETTOP-101,110,58);ctx.fillStyle='#8a6230';ctx.fillRect(NETX-55,NETTOP-74,110,3);
 ctx.fillStyle='#fff';ctx.font='700 30px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText(L.e,NETX,NETTOP-60);
 // net = PLP
 ctx.fillStyle='#7a7a7a';ctx.fillRect(NETX-4,NETTOP,8,GROUND-NETTOP);
 const nc=pmp?'#fb8c00':'#f5c518';ctx.strokeStyle=nc;ctx.lineWidth=2;
 for(let y=NETTOP+8;y<NETTOP+110;y+=10){ctx.beginPath();ctx.moveTo(NETX-14,y);ctx.lineTo(NETX+14,y);ctx.stroke()}
 for(let x=-14;x<=14;x+=7){ctx.beginPath();ctx.moveTo(NETX+x,NETTOP+8);ctx.lineTo(NETX+x,NETTOP+108);ctx.stroke()}
 ctx.fillStyle='#1b1b1b';ctx.fillRect(NETX-34,NETTOP-4,68,22);ctx.fillStyle=nc;ctx.fillRect(NETX-32,NETTOP-2,64,18);
 ctx.fillStyle=pmp?'#fff':'#3a2a00';ctx.font='700 14px "Noto Sans TC",sans-serif';ctx.fillText(pmp?'PMP':'PLP',NETX,NETTOP+12);
 // players
 for(const p of [S.me,S.cpu]){const am=isAmino(p),E=S.end,id=(am?'a':'k')+p.k;
  ctx.fillStyle='#00000035';ctx.beginPath();ctx.ellipse(p.x,GROUND+2,30,5,0,0,7);ctx.fill();
  if(E){const win=(E.won?S.me:S.cpu)===p,t=E.t;
   if(win){const hop=RM?0:Math.abs(Math.sin(t*6))*34,ang=RM?0:Math.sin(t*8)*.28,sx=RM?0:Math.sin(t*4)*12;
    ctx.save();ctx.translate(p.x+sx,p.y-4-hop);ctx.rotate(ang);drawStruct(ctx,id,0,0,18,1,false);ctx.restore();
    tag(p.x+sx,p.y-62-hop,name(p),am);
   }
   else{const f=Math.min(1,t/.5),dirn=p.side<0?-1:1;
    ctx.save();ctx.translate(p.x+dirn*f*14,GROUND-34+f*6);ctx.rotate(dirn*f*Math.PI*.9);drawStruct(ctx,id,0,0,18,.85,false);ctx.restore();
    if(f>=1){ctx.fillStyle='#4a4a4a';ctx.font='700 20px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.fillText('x_x',p.x+dirn*40,GROUND-70)}}
   continue}
  drawStruct(ctx,id,p.x,p.y-4,18,1,false);
  tag(p.x,p.y-62,name(p),am);
 }
 if(S.end){const E=S.end,txt=E.won?'You win!':'You lose!';
  ctx.font='700 46px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.lineWidth=7;ctx.strokeStyle='#1b1b1b';const y=150+(RM?0:Math.sin(E.t*3)*6);
  ctx.strokeText(txt,VW/2,y);ctx.fillStyle=E.won?'#ffd54f':'#ff8a80';ctx.fillText(txt,VW/2,y)}
 // ball = NH₂
 if(!S.end&&(!S.dead||S.pause>.6)){const x=b.x,y=b.y;ctx.fillStyle='#1b1b1b';ctx.fillRect(x-21,y-13,42,26);ctx.fillStyle='#1e88e5';ctx.fillRect(x-19,y-11,38,22);ctx.fillStyle='#fff';ctx.font='700 13px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('NH₂',x,y);ctx.textBaseline='alphabetic'}
 // score
 ctx.font='700 30px "Noto Sans TC",sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#1b1b1b';
 for(const [t,x] of [[S.score[0],240],[S.score[1],720]]){ctx.strokeText(t,x,54);ctx.fillStyle='#fff';ctx.fillText(t,x,54)}
 ctx.textAlign='center';ctx.font='700 17px "Noto Sans TC",sans-serif';
 for(const f of S.fx){ctx.globalAlpha=Math.min(1,f.a);ctx.lineWidth=4;ctx.strokeStyle='#1b1b1b';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)}
 ctx.globalAlpha=1;
}

/* ---------- input ---------- */
const KM={arrowleft:'left',a:'left',arrowright:'right',d:'right'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!run)return;
 if(KM[k]){input[KM[k]]=1;e.preventDefault()}
 if(k==='arrowup'||k==='w'){e.preventDefault();if(!e.repeat)input.jump=1}
 if(k===' '||k==='x'||k==='enter'){e.preventDefault();if(!e.repeat)input.hit=1}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(KM[k])input[KM[k]]=0});
addEventListener('blur',()=>{input.left=input.right=0});
$('snd').onclick=()=>{audio();sndOn=!sndOn;$('snd').textContent='Sound: '+(sndOn?'on':'off');$('snd').setAttribute('aria-pressed',sndOn);$('snd').blur()};
$('pad').querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='jump'||k==='hit')input[k]=1;else input[k]=1});
 const up=()=>{if(k==='left'||k==='right')input[k]=0};b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)});
/* touch controls: floating joystick (left) + action buttons (right), multi-touch */
{const stick=$('stick'),knob=$('knob');let sid=null;
 const place=x=>{const r=stick.getBoundingClientRect(),k=Math.max(20,Math.min(r.width-20,x-r.left));knob.style.left=k+'px'};
 stick.addEventListener('pointerdown',e=>{e.preventDefault();if(sid!==null)return;sid=e.pointerId;try{stick.setPointerCapture(sid)}catch(_){}stick.classList.add('on');stick._lx=e.clientX;input.drag=0;place(e.clientX)});
 stick.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;input.drag+=(e.clientX-stick._lx)/sc*1.8;stick._lx=e.clientX;place(e.clientX)});
 const end=e=>{if(e.pointerId!==sid)return;sid=null;stick.classList.remove('on');input.drag=0;knob.style.left='50%'};
 stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
 const btn=(el,f)=>{el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.classList.add('on');f()});const up=()=>el.classList.remove('on');el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up)};
 btn($('tJump'),()=>{input.jump=1});btn($('tHit'),()=>{input.hit=1});
 btn($('tSnd'),()=>{audio();sndOn=!sndOn;$('tSnd').textContent='♪ '+(sndOn?'on':'off');$('snd').textContent='Sound: '+(sndOn?'on':'off')});
}
function goFull(){if(!COARSE)return;try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||(()=>Promise.reject())).call(el)?.catch?.(()=>{});screen.orientation?.lock?.('landscape').catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run){run=false;input={left:0,right:0,jump:0,hit:0,axis:0};ov.hidden=false;ov.classList.add('center');$('ovIn').innerHTML='<h2>Paused</h2><button class="go" id="b">Resume</button>';$('b').onclick=()=>{ov.hidden=true;run=true;last=performance.now();(rafId=requestAnimationFrame(loop))}}});

draw();chooser();
}
